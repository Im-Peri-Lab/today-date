name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint · Unit Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # 빌드는 실제 Supabase를 호출하지 않는다(클라이언트는 지연 생성) — CI에서
          # 검증용으로만 쓰는 더미 값. 배포 환경변수와는 무관하다.
          SUPABASE_URL: https://ci-unused.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-unused-service-role-key
          SESSION_SECRET: ci-only-fixed-session-secret-not-for-any-real-deployment-use
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

  e2e:
    name: E2E (Playwright, API mocked — DB 불필요)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
