name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint · Unit Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # 빌드는 실제 Supabase를 호출하지 않는다(클라이언트는 지연 생성) — CI에서
          # 검증용으로만 쓰는 더미 값. 배포 환경변수와는 무관하다.
          SUPABASE_URL: https://ci-unused.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-unused-service-role-key
          SESSION_SECRET: ci-only-fixed-session-secret-not-for-any-real-deployment-use
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

  e2e:
    name: E2E (Playwright — 브라우저 mocking + PostgREST 스텁, 실 DB 불필요)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 두 프로젝트를 모두 돌린다:
      #   chromium     — /api/* 를 브라우저에서 mocking 하는 위저드 스펙
      #   chromium-db  — PostgREST 스텁(e2e/stub/server.mjs)을 세워 실제 라우트를
      #                  타는 커플 격리·인증 스펙. 실 Supabase 접속이 없으므로
      #                  시크릿 없이 상시 실행된다(환경변수는 playwright.config.ts 의
      #                  webServer.env 가 전부 명시한다).
      - run: npm run test:e2e
